# n8n 自托管验证环境（SQLite 单容器，短平快）。
# 生产多租户/队列可替换为 postgres + worker；此处仅验证「通用 UC 六步模板 + 真实执行审计投影」。
services:
  n8n:
    image: n8nio/n8n:2.38.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-coolai-dev-encryption-key-change-me}
      # Code 节点读取 DEEPSEEK_MODEL（自托管内部验证环境，显式放开；生产建议改用 n8n Variables/Secrets）
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # DeepSeek 凭据从宿主机透传；在 coolai 上部署时用 .env 注入真实 key
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      # 审批通知网关（Apprise 侧车）；通知失败不阻断 UC 执行
      - APPRISE_NOTIFY_URL=${APPRISE_NOTIFY_URL:-http://apprise:8000/notify/}
    volumes:
      - n8n_data:/home/node/.n8n
      # 通用 UC 六步模板（UC 是数据，不是代码）
      - ../../instances/uc-template/n8n.workflow.json:/data/uc-template.n8n.workflow.json:ro

  # Apprise：通知网关（飞书/Lark、钉钉、企业微信 Bot 等 130+ 渠道的通用连接器）。
  # 渠道只通过 APPRISE_STATELESS_URLS 注入，不写死任何客户业务。
  apprise:
    image: caronc/apprise:v1.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APPRISE_STATELESS_URLS=${APPRISE_STATELESS_URLS:-}
      - APPRISE_WORKERS=${APPRISE_WORKERS:-2}
volumes:
  n8n_data:
